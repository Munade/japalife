<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#08774C">
<meta name="description" content="A life sim about Nigerian life in the UK.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Japa Life">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;min-height:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:auto;user-select:auto}
img{max-width:100%}[hidden]{display:none!important}
</style>
<title>Japa Life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Figtree:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-first game. Top status, live canvas stage, needs, context actions; bottom nav opens map, phone and profile sheets. */
:root{
  --ground:#E9EDE8; --surface:#FFFFFF; --ink:#18221E; --muted:#5D6B64; --line:#D3DBD5;
  --green:#08774C; --green-soft:#D6EDE2; --danfo:#F2B705; --danfo-ink:#3A2C00; --clay:#C24E36; --clay-soft:#F6DDD6;
  --wall:#E3DCCB; --wall2:#D3CBB8; --floor:#B98F62; --floor2:#AD845A; --venue-floor:#C9C2B4;
  --phone:#121815; --phone-ink:#EAF1ED;
  --f-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#101614; --surface:#18201D; --ink:#E5ECE8; --muted:#97A69E; --line:#2A3531;
  --green:#3CC488; --green-soft:#173A2B; --danfo:#F5C531; --danfo-ink:#2B2000; --clay:#EE7A60; --clay-soft:#43231B;
  --wall:#4A4438; --wall2:#3E392F; --floor:#6E5238; --floor2:#634930; --venue-floor:#3A3833;
  --phone:#05080A; --phone-ink:#EAF1ED; color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#101614; --surface:#18201D; --ink:#E5ECE8; --muted:#97A69E; --line:#2A3531;
  --green:#3CC488; --green-soft:#173A2B; --danfo:#F5C531; --danfo-ink:#2B2000; --clay:#EE7A60; --clay-soft:#43231B;
  --wall:#4A4438; --wall2:#3E392F; --floor:#6E5238; --floor2:#634930; --venue-floor:#3A3833;
  --phone:#05080A; --phone-ink:#EAF1ED; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
h1,h2,h3{text-wrap:balance;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--danfo);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}

/* top */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:21px;line-height:1;letter-spacing:.4px}
.brand span{color:var(--green)}
.chips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.chip{padding:4px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.chip.money{background:var(--danfo);color:var(--danfo-ink);border-color:transparent;font-weight:700}
.chip.money.neg{background:var(--clay);color:#fff}

/* stage */
.stage{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.stage canvas{display:block;width:100%;height:auto;aspect-ratio:360/230;touch-action:manipulation}
.loc{position:absolute;left:10px;top:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.loc span{background:color-mix(in srgb,var(--surface) 90%,transparent);color:var(--ink);padding:3px 10px;border-radius:999px;font-weight:800;font-size:12.5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loc span.closed{background:var(--clay);color:#fff}
.say{padding:9px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;justify-content:space-between}
.say .who{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.say b{font-weight:800}

/* needs */
.needs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
@media (min-width:460px){.needs{grid-template-columns:repeat(4,1fr)}}
.need{min-width:0}
.need .row{display:flex;justify-content:space-between;font-size:12px;font-weight:700;gap:4px}
.need .row span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.need .row span:last-child{font-family:var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:7px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s}
.need.bad .row span:first-child{color:var(--clay)}

/* people + actions */
.sect{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:800;margin:2px 0 -4px}
.people{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.person{flex:none;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;font-weight:700;font-size:13.5px}
.person:hover{border-color:var(--green)}
.person .face{width:30px;height:30px;border-radius:50%;display:block;flex:none;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.person small{display:block;font-weight:600;color:var(--muted);font-size:11px;line-height:1.1}
.acts{display:grid;gap:8px}
.act{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 13px;transition:transform .08s,border-color .15s}
.act:hover{border-color:var(--green)}
.act:active{transform:scale(.985)}
.act .main{flex:1;min-width:0}
.act .lbl{font-weight:800;display:block}
.act .sub{font-size:12.5px;color:var(--muted);display:block}
.act .meta{font-family:var(--f-mono);font-size:12px;text-align:right;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.act .meta b{display:block;color:var(--ink)}
.act .meta b.plus{color:var(--green)}
.act.off{opacity:.55}
.act.off .sub{color:var(--clay)}
.act.go{background:var(--green);border-color:var(--green);color:#fff}
.act.go .sub,.act.go .meta,.act.go .meta b{color:#fff}
.busy .act{pointer-events:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.card h2{font-family:var(--f-display);font-size:15px;letter-spacing:.3px;margin-bottom:8px;font-weight:400}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13.5px}
.feed li{display:flex;gap:8px}
.feed time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-width:64px;padding-top:2px;font-variant-numeric:tabular-nums}
.feed .good{color:var(--green);font-weight:600}.feed .bad{color:var(--clay);font-weight:600}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:12px;font-weight:800;color:var(--muted);position:relative}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--green);background:var(--green-soft)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);background:var(--clay);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-family:var(--f-mono)}

/* sheets */
.scrim{position:fixed;inset:0 0 calc(66px + env(safe-area-inset-bottom,0px)) 0;z-index:20;background:color-mix(in srgb,#000 45%,transparent);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);color:var(--ink);width:100%;max-width:560px;max-height:calc(100% - 24px);overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px 20px;display:flex;flex-direction:column;gap:12px;overscroll-behavior:contain;box-shadow:0 -10px 30px rgba(0,0,0,.18)}
.panel .hd{display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel .hd h3{font-family:var(--f-display);font-weight:400;font-size:20px}
.x{border:0;background:var(--ground);border-radius:10px;width:36px;height:36px;font-size:18px;font-weight:800;flex:none}
.mapbox{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--green-soft)}
.mapbox>svg{display:block;width:100%;height:auto}
.leafbox{height:min(58vh,440px);position:relative;z-index:0}
.citybox{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#B9C9B0}
.citybox canvas{display:block;width:100%;height:min(58vh,460px);touch-action:none;cursor:grab}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:10px;border:0;background:#fff;color:#18221E;font:800 20px var(--f-body);box-shadow:0 1px 5px rgba(0,0,0,.3)}
.mapctl2{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
/* Leaflet core (minimal) */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;background:var(--green-soft);font-family:var(--f-body);outline:0}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-container img.leaflet-tile{max-width:none!important;max-height:none!important;width:256px;height:256px;padding:0}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}.leaflet-map-pane svg{z-index:200}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:0}.leaflet-bottom .leaflet-control{margin-bottom:0}
.leaflet-bar{border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.35);overflow:hidden}
.leaflet-bar a{display:block;width:34px;height:34px;line-height:34px;text-align:center;background:var(--surface);color:var(--ink);text-decoration:none;font:800 18px var(--f-body);border-bottom:1px solid var(--line)}
.leaflet-bar a:last-child{border-bottom:0}.leaflet-bar a.leaflet-disabled{opacity:.4}
.leaflet-control-attribution{background:color-mix(in srgb,var(--surface) 85%,transparent);color:var(--muted);padding:1px 6px;font-size:10.5px}
.leaflet-control-attribution a{color:var(--green)}
.leaflet-tooltip{position:absolute;padding:3px 8px;background:var(--surface);color:var(--ink);border-radius:6px;white-space:nowrap;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.3);font:800 12px var(--f-body)}
.leaflet-tooltip-top{margin-top:-6px}
.m-land{fill:var(--ground)}.m-water{fill:none;stroke:#7FB2D6;stroke-width:22;stroke-linecap:round;opacity:.8}
.m-park{fill:#9BCB8E;opacity:.55}.m-road{stroke:var(--line);stroke-width:5;fill:none;stroke-linecap:round}
.m-pin{cursor:pointer}.m-pin circle{stroke:var(--surface);stroke-width:2.5}
.m-pin text{font-family:var(--f-body);font-size:9.5px;font-weight:800;fill:var(--ink);paint-order:stroke;stroke:var(--ground);stroke-width:3px}
.m-pin.closed circle{opacity:.45}.m-pin.sel circle{stroke:var(--ink);stroke-width:3}
.c-work{fill:#2B5BA8}.c-food{fill:#C24E36}.c-shop{fill:#C9921B}.c-social{fill:#7A3FA0}.c-learn{fill:#0E7C86}.c-home{fill:#08774C}.c-travel{fill:#475569}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.vinfo{display:flex;flex-direction:column;gap:8px}
.vinfo .nm{font-weight:800;font-size:17px}
.vinfo .meta{font-size:13px;color:var(--muted)}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}

/* phone */
.phone{background:var(--phone);color:var(--phone-ink)}
.phone .x{background:#ffffff1a;color:var(--phone-ink)}
.phone .hd h3{color:var(--phone-ink)}
.apps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;padding:6px 0}
.app{border:0;background:none;color:var(--phone-ink);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:700;position:relative}
.app i{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-family:var(--f-display);font-size:22px;color:#fff}
.app .badge{left:calc(50% + 14px);top:-4px}
.pcard{background:#ffffff12;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.pcard .big{font-family:var(--f-mono);font-size:26px;font-weight:700}
.pcard .lbl{font-size:12px;opacity:.75;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.pbtn{border:0;border-radius:12px;padding:11px 12px;font-weight:800;background:#ffffff1f;color:var(--phone-ink);text-align:left}
.pbtn.g{background:#25A866;color:#fff}
.pbtn:disabled{opacity:.45}
.txs{list-style:none;margin:0;padding:0;font-size:13px;display:flex;flex-direction:column;gap:6px}
.txs li{display:flex;justify-content:space-between;gap:10px}
.txs b{font-family:var(--f-mono)}
.threads{display:flex;flex-direction:column}
.thread{border:0;background:none;color:var(--phone-ink);display:flex;gap:10px;align-items:center;padding:10px 4px;border-bottom:1px solid #ffffff14;text-align:left}
.thread .av{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff}
.thread .tx{flex:1;min-width:0}
.thread .tx b{display:block}
.thread .tx span{display:block;font-size:12.5px;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .n{background:#25A866;color:#fff;border-radius:10px;font-size:11px;font-weight:800;padding:2px 7px}
.bubbles{display:flex;flex-direction:column;gap:6px;padding:4px 0}
.bub{max-width:82%;padding:8px 11px;border-radius:12px;font-size:14px;background:#ffffff1a;align-self:flex-start}
.bub.me{background:#1F7A4D;align-self:flex-end}
.bub time{display:block;font-size:10.5px;opacity:.6;font-family:var(--f-mono)}
.rich{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;counter-reset:r}
.rich li{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#ffffff0d}
.rich li.me{background:#F2B70533;outline:1px solid #F2B705}
.rich .rk{font-family:var(--f-mono);width:24px;opacity:.7}
.rich .nm{flex:1;min-width:0;font-weight:700}
.rich .w{font-family:var(--f-mono);font-size:13px}

/* me + creator */
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;font-weight:700}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:4px 10px;border-radius:999px;background:var(--green-soft);font-size:12.5px;font-weight:700}
.tag.warn{background:var(--clay-soft);color:var(--clay)}
.tag.ok{background:var(--green);color:#fff}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.goals li{display:flex;gap:9px;align-items:flex-start}
.tick{flex:none;width:18px;height:18px;border-radius:5px;border:2px solid var(--line);margin-top:1px;display:grid;place-items:center;font-size:12px;font-weight:800}
.goals li.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.goals li.done span:last-child{text-decoration:line-through;color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:30;background:color-mix(in srgb,#000 55%,transparent);display:grid;place-items:center;padding:16px}
.overlay.solid{background:var(--ground);place-items:start center;overflow:auto}
.modal{background:var(--surface);color:var(--ink);border-radius:18px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3);max-height:92vh;overflow:auto}
.overlay.solid .modal{box-shadow:none;border:1px solid var(--line);margin-block:16px;max-height:none}
.modal .kick{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--green);font-weight:700}
.modal h3{font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.15}
.modal p{margin:0}
.choice{border:2px solid var(--line);background:var(--ground);border-radius:12px;padding:11px 13px;text-align:left;font-weight:700}
.choice:hover{border-color:var(--green)}
.choice small{display:block;font-weight:400;color:var(--muted)}
.choice.sel{border-color:var(--green);background:var(--green-soft)}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:700}
.field input{font:inherit;font-weight:600;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--ground);color:var(--ink)}
.go{background:var(--green);color:#fff;border:0;border-radius:12px;padding:13px;font-weight:800;font-size:16px}
.go:disabled{opacity:.5}
.ghost{background:none;border:0;color:var(--muted);font-weight:700;padding:8px}
.hero-title{font-family:var(--f-display);font-size:42px;line-height:.95}
.hero-title span{color:var(--green)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.sw.sel{box-shadow:0 0 0 3px var(--green)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:2px solid var(--line);background:var(--ground);border-radius:10px;padding:7px 11px;font-weight:700;font-size:13.5px}
.opt.sel{border-color:var(--green);background:var(--green-soft)}
.preview{display:flex;justify-content:center;background:var(--green-soft);border-radius:14px}
.preview canvas{width:140px;height:160px}
.steps{display:flex;gap:5px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--green)}
.lottery{font-family:var(--f-display);font-size:26px;text-align:center;padding:22px 10px;border-radius:14px;background:var(--danfo);color:var(--danfo-ink);line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);z-index:40;text-align:center}
.person.on{border-color:var(--green);background:var(--green-soft)}
.talklog{display:flex;flex-direction:column;gap:7px;max-height:42vh;overflow:auto;padding:4px 2px}
.bub2{max-width:84%;padding:9px 12px;border-radius:14px 14px 14px 4px;background:var(--ground);border:1px solid var(--line);font-size:14.5px;align-self:flex-start}
.bub2.me{border-radius:14px 14px 4px 14px;background:var(--green);color:#fff;border-color:var(--green);align-self:flex-end}
.tsys{align-self:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--green-soft);padding:3px 10px;border-radius:999px;text-align:center}
.live{display:flex;flex-direction:column;gap:10px}
.live h2{margin:0}
.lmeta{font-size:12.5px;color:var(--muted);margin:0}
.lmsgs{display:flex;flex-direction:column;gap:6px;max-height:220px;overflow:auto;font-size:14px}
.lmsg{background:var(--ground);border-radius:10px;padding:7px 10px;overflow-wrap:anywhere}
.lmsg.me{background:var(--green-soft)}
.lmsg b{font-weight:800;margin-right:4px}
.lform{display:flex;gap:8px}
.lform input{flex:1;min-width:0;font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--ground);color:var(--ink)}
.lform .go{padding:10px 16px;font-size:15px}
.story .modal{gap:10px}
.skick{display:flex;justify-content:space-between;align-items:center;gap:8px;font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--green);font-weight:700}
.skick .ghost{font-family:var(--f-body);text-transform:none;letter-spacing:0;font-size:13px;padding:4px}
.scv{border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.scv canvas{display:block;width:100%;aspect-ratio:360/230}
.swho{font-family:var(--f-display);font-size:16px;color:var(--clay)}
.stext{font-size:16.5px;line-height:1.55;margin:0;text-wrap:pretty}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function venues(){
  const c=CITIES[S.city], home=c.homes.find(h=>h.id===S.home);
  const out=[{id:'home',type:'home',name:home.name,x:POS.home[0],y:POS.home[1],ll:home.ll}];
  for(const t of Object.keys(c.v)) out.push({id:t,type:t,name:c.v[t],x:POS[t][0],y:POS[t][1],ll:c.ll[t]});
  c.eats.forEach(e=>out.push({id:'eat-'+e.id,type:'restaurant',rid:e.id,name:e.name,area:e.area,dish:e.dish,cost:e.cost,x:e.x,y:e.y,ll:e.ll}));
  (c.night||[]).forEach(n=>out.push({id:'n-'+n.id,type:n.type,name:n.name,area:n.area,ll:n.ll,x:n.x,y:n.y,entry:n.entry,real:n.real}));
  if(S.biz&&BIZ[S.biz.type].where==='premises')out.push({id:'mybiz',type:'mybiz',name:S.biz.name,area:home.name.split(',')[1]||'',ll:S.biz.ll,x:POS.home[0]+26,y:POS.home[1]-18});

  return out;
}

function isOpen(type,day=dow(),h=S.hour){
  for(const [days,from,to] of VT[type].open){
    if(days.includes(day)&&h>=from&&h<Math.min(to,24))return true;
    if(to>24&&days.includes((day+6)%7)&&h<to-24)return true;
  }
  return false;
}
function crowd(v,day=dow(),h=S.hour){
  if(!v||v.type==='home'||!isOpen(v.type,day,h))return null;
  const wk=day>=4&&day<=5,hh=h<6?h+24:h;let x=.3;
  if(['club','karaoke'].includes(v.type))x=(wk?1:.5)*(hh>=23&&hh<27?1:hh>=21?.6:.3);
  else if(['lounge','bar'].includes(v.type))x=(wk?.9:.55)*(hh>=20&&hh<24?1:hh>=17?.65:.4);
  else if(v.type==='dayparty')x=hh>=16&&hh<20?1:.6;
  else if(['restaurant','chicken','caribbean','fine'].includes(v.type))x=(hh>=12&&hh<14)||(hh>=18&&hh<21)?.85:.35;
  else if(v.type==='cafe')x=hh>=8&&hh<11?.85:.4;
  else if(['hall','church'].includes(v.type))x=.9;
  else if(['market','retail'].includes(v.type))x=day>=5?.85:.5;
  else if(v.type==='pub')x=day>=5||hh>=19?.8:.35;
  x*=.85+hash(S.day+v.id)*.3;
  return x>.8?'Packed':x>.6?'Busy':x>.35?'Lively':'Quiet';
}
function hoursText(type){
  if(type==='home'||type==='carehome'||type==='airport')return 'Open 24 hours';
  return VT[type].open.map(([d,f,t])=>{const dd=d.length===7?'Daily':d.length===5&&d[0]===0&&d[4]===4?'Mon–Fri':d.map(x=>DAYS[x]).join(', ');return `${dd} ${hhmm(f)}–${hhmm(t%24)}`}).join(' · ');
}

/* ---------- travel ---------- */
function km(a,b){const R=6371,r=x=>x*Math.PI/180;const dl=r(b[0]-a[0]),dn=r(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function travelOptions(to){
  const a=here(),b=venue(to);
  if(a.trip||b.trip)return [{id:'train',label:'Train to London',h:2.5,cost:35}];
  const d=km(a.ll,b.ll),L=CITIES[S.city].london,o=[];
  if(d<=6)o.push({id:'walk',label:'Walk',h:r2(.1+d/5),cost:0});
  if(d>15)o.push({id:'bus',label:'Train',h:r2(.3+d/45),cost:L?12:9});
  else o.push({id:'bus',label:L?'Bus or Tube':'Bus or tram',h:r2(.2+d/16),cost:L?2.5:2});
  o.push({id:'uber',label:'Uber',h:r2(.12+d/28),cost:Math.round(5+d*1.9)});
  return o.map(x=>Object.assign(x,{km:Math.round(d*10)/10}));
}
function travel(to,modeId){
  const m=travelOptions(to).find(x=>x.id===modeId);
  if(S.money<m.cost){toast(`You need ${gbp2(m.cost)} for that.`);return false}
  if(m.cost)spend(m.cost,m.label);
  advance(m.h);
  if(modeId==='walk'){add('energy',-Math.min(10,m.h*6));if(S.weather==='Drizzle')add('hygiene',-6)}
  S.at=to; anim.reset=true; S.company=null;
  const v=here(); if(v.type==='restaurant'||v.type==='fine')S.visited[v.rid]=S.visited[v.rid]||0;
  if(Math.random()<.05&&!S.queue.length)S.queue.push(pick(['bump','busker','lostcard']));
  return true;
}

/* ---------- time ---------- */
function advance(h,opt={}){
  const steps=Math.max(1,Math.round(h*2));
  for(let i=0;i<steps;i++){
    const n=S.needs,k=.5,sl=opt.sleep,night=S.hour<5||S.hour>=23;
    if(opt.away){S.hour+=k;if(S.hour>=24){S.hour-=24;newDay()}continue}
    n.hunger=clamp(n.hunger-(sl?1.5:4)*k);
    const HF=(S.items&&typeof homeFx==='function'&&S.at==='home')?homeFx():{comfort:1,fun:0,homesick:0};
    let eg=sl?(12+HF.comfort*1.6):(night&&!has('nightowl')?-5:-3);
    if(sl&&S.weather==='Cold snap'&&!own('blanket'))eg*=.75;
    n.energy=clamp(n.energy+eg*k);
    n.bladder=clamp(n.bladder-(sl?2:6)*k);
    n.hygiene=clamp(n.hygiene-(sl?.8:2)*k);
    let fd=sl?.3:2*(has('hustler')?1.25:1)*(S.weather==='Cold snap'&&!S.flags.coat?1.3:1);
    if(S.at==='home')fd*=1-Math.min(.45,HF.fun*.06);
    n.fun=clamp(n.fun-fd*k);
    let sd=sl?.3:1.5*(has('homebody')?.7:1)*(S.partner&&S.npcs[S.partner].stage==='married'?.6:1);
    n.social=clamp(n.social-sd*k);
    S.pressure=clamp(S.pressure+.7*k*(has('prayer')?.6:1));
    let hs=(n.social<30?1.4:.9)*(1-Math.min(.5,(S.items&&typeof homeFx==='function'?homeFx().homesick:0)));
    S.homesick=clamp(S.homesick+hs*k);
    if(n.hunger<=0){n.energy=clamp(n.energy-2*k);n.fun=clamp(n.fun-2*k)}
    if(n.bladder<=0){n.bladder=100;n.hygiene=0;n.fun=clamp(n.fun-20);log("You couldn't hold it. Nobody saw. Probably.",'bad')}
    S.hour+=k;
    if(S.hour>=24){S.hour-=24;newDay()}
  }
}

function menuOf(v){if(v.type==='fine')return ['tasting'];return MENUS[v.rid||v.type]||['jollof']}
function dishPrice(k,v){return k==='tasting'?price(v.cost):price(DISHES[k].p)}
function friendsFree(){const here_=peopleAt(here());return Object.keys(S.npcs).filter(id=>S.npcs[id].met&&S.npcs[id].rel>=8&&!here_.includes(id)&&!NPCS[id].aunty)}
function orderDish(k){
  const v=here(),D=DISHES[k],p=dishPrice(k,v);
  if(S.money<p)return 'Not enough money.';
  spend(p,`${D.n} at ${v.name}`);advance(D.drink?.25:v.type==='fine'?3:1);
  add('hunger',D.h);add('fun',D.f);add('social',6);if(D.naija)add('homesick',-12);
  const first=!S.dishes[k];S.dishes[k]=(S.dishes[k]||0)+1;
  if(v.rid)S.visited[v.rid]=(S.visited[v.rid]||0)+1;
  const comp=peopleAt(v);comp.forEach(id=>rel(id,D.drink?2:5));
  checkGoals();
  return `${D.n}${first?' (first time!)':''}. ${pick(D.drink?['Refreshing.','Ice cold. Perfect.']:comp.length?[`You shared bites with ${NPCS[comp[0]].name}.`,'Good food, better company.']:['It hit the spot.','Delicious.','You licked the plate. Nobody saw.'])}`;
}
function inviteFriends(ids){
  const v=here();
  const came=ids.filter(id=>Math.random()<.45+S.npcs[id].rel/150);
  advance(.5);
  if(!came.length){add('fun',-4);return 'Nobody could make it this time. Next time.'}
  S.company={at:v.id,ids:came,day:S.day,until:Math.min(23.9,S.hour+3)};
  came.forEach(id=>rel(id,4));add('social',10);
  return `${came.map(id=>NPCS[id].name).join(' and ')} came to join you!`;
}

const GOALS=[
  ['rent','Pay rent 4 weeks in a row',()=>S.rentStreak>=4],
  ['dishes5','Try 5 different dishes',()=>Object.keys(S.dishes).filter(k=>DISHES[k]).length>=5],
  ['eats3','Eat at 3 Nigerian restaurants',()=>Object.keys(S.visited).filter(k=>S.visited[k]>0&&MENUS[k]).length>=3],
  ['friends3','Make 3 good friends',()=>Object.values(S.npcs).filter(n=>n.rel>=50).length>=3],
  ['likes','Learn what 5 people love talking about',()=>Object.values(S.npcs).filter(n=>Object.values(n.known||{}).includes(1)).length>=5],
  ['host','Host a dinner at home',()=>S.hosted>=1],
  ['owambe','Party at 2 owambes',()=>S.owambes>=2],
  ['jollof','Win the jollof war with Kwame',()=>!!S.flags.jollofWin],
  ['flat','Own 8 pieces of furniture',()=>S.items&&[...S.items,...S.store].filter(i=>ITEMS[i.k].p>0).length+S.acc.length>=8],
  ['promo','Reach level 3 in your career',()=>S.track&&S.level>=2],
  ['live','Chat with a real player',()=>!!S.flags.liveChatted],
];
function dreamProgress(){
  switch(S.dream){
    case 'foodie':return Math.min(1,Object.keys(S.dishes).filter(k=>DISHES[k]).length/15);
    case 'social':return Math.min(1,Object.values(S.npcs).filter(n=>n.rel>=50).length/5);
    case 'top':return S.track?S.level/4:0;
    case 'rich':{const r=myRank();return r<=3?1:Math.max(0,1-(r-3)/8)}
    case 'family':{if(!S.partner)return Math.min(.3,Math.max(0,...Object.values(S.npcs).map(n=>n.rel))/100*.3);const st=S.npcs[S.partner].stage;return st==='married'?1:st==='engaged'?.75:.5}
  }return 0;
}
function checkGoals(){
  GOALS.forEach(([id,l,t])=>{if(!S.goals[id]&&t()){S.goals[id]=true;log('Goal complete: '+l,'good')}});
  if(!S.flags.dreamDone&&dreamProgress()>=1){S.flags.dreamDone=true;log(`LIFETIME DREAM ACHIEVED: ${DREAMS[S.dream].name}!`,'good');toast(`Dream achieved: ${DREAMS[S.dream].name}!`)}
}

/* ---------- side-hustle gigs ---------- */
function gigState(){if(!S.gigs)S.gigs={board:[],acc:[],rating:3,done:0,seq:1};return S.gigs}
function refreshGigs(){
  const G=gigState(),vs=venues();
  // missed gigs
  G.acc=G.acc.filter(g=>{if(S.day>g.day||(S.day===g.day&&S.hour>g.start+1.5)){G.rating=Math.max(1,r2(G.rating-.5));log(`You missed the gig: ${g.t}. Your rating dropped.`,'bad');return false}return true});
  G.board=G.board.filter(g=>g.day>S.day||(g.day===S.day&&S.hour<g.start-1));
  for(const off of [0,1]){const day=S.day+off,dw=(day-1)%7;
    if(G.board.filter(g=>g.day===day).length>=4)continue;
    const pool=GIGS.filter(t=>t.days.includes(dw));
    const n=3+Math.floor(Math.random()*2)+(S.contacts?Math.min(2,Math.floor(S.contacts/2)):0);
    for(let k=0;k<n&&pool.length;k++){const t=pick(pool);
      const places=t.at.includes('home')?[{id:'home',name:'Your kitchen'}]:vs.filter(v=>t.at.includes(v.type)&&!v.trip);if(!places.length)continue;
      const v=pick(places),start=Math.round(rnd(t.start[0],t.start[1]));if(off===0&&start<=S.hour+1)continue;
      const pay=Math.round(rnd(t.pay[0],t.pay[1])*(.85+G.rating*.06));
      if(G.board.some(g=>g.day===day&&g.tid===t.id))continue;
      G.board.push({gid:G.seq++,tid:t.id,t:t.t,e:t.e,d:t.d,vid:v.id,vname:v.name,day,start,h:t.h,pay,need:t.need,ing:t.ing||0})}}
  G.board.sort((a,b)=>a.day-b.day||a.start-b.start);
}
function gigBlock(g){if(S.workBan)return 'You can\'t work while your asylum claim is being decided';if(g.need&&S.skills[g.need[0]]<g.need[1])return `Needs ${g.need[0]} ${g.need[1]}`;if(gigState().acc.length>=3)return 'You already have 3 gigs booked';if(gigState().acc.some(a=>a.day===g.day&&Math.abs(a.start-g.start)<Math.max(a.h,g.h)))return 'Clashes with another gig';return false}
function acceptGig(gid){const G=gigState(),g=G.board.find(x=>x.gid===gid);if(!g)return;const why=gigBlock(g);if(why){toast(why);return}G.board=G.board.filter(x=>x!==g);G.acc.push(g);G.acc.sort((a,b)=>a.day-b.day||a.start-b.start);toast(`Booked: ${g.t}, ${g.day===S.day?'today':'tomorrow'} at ${hhmm(g.start)}`)}
function gigActs(){
  if(!S.gigs)return [];const v=here();
  return S.gigs.acc.filter(g=>g.vid===v.id).map(g=>({id:'gig-'+g.gid,gig:true,at:v.type,label:`Gig: ${g.t}`,sub:`${g.day===S.day?'Today':'Tomorrow'} ${hhmm(g.start)} · ${g.vname}`,emote:g.e,h:g.h,earn:()=>g.pay,
    cond:()=>g.day!==S.day?'This gig is tomorrow':S.hour<g.start-.5?`Starts at ${hhmm(g.start)}. Come back then`:S.hour>g.start+1?'Too late. You missed the start':(g.ing&&S.ingredients<g.ing)&&`Needs ${g.ing} bags of ingredients`,
    run:()=>{const G=S.gigs;G.acc=G.acc.filter(x=>x!==g);if(g.ing)S.ingredients-=g.ing;
      const good=Math.random()<.55+(g.need?Math.min(.3,(S.skills[g.need[0]]-g.need[1])*.1):.15)+(S.needs.energy>40?.1:-.1);
      const tip=good?Math.round(g.pay*rnd(.05,.25)):0;earn(g.pay+tip,`Gig: ${g.t}`);G.done++;G.rating=clamp(r2(G.rating+(good?.25:-.1)),1,5);
      add('energy',-g.h*3);add('social',8);if(g.need)skill(g.need[0],.3);
      return good?`${g.t}: smashed it. +${gbp(g.pay)}${tip?` and ${gbp(tip)} in tips`:''}. ★ ${G.rating.toFixed(1)}`:`${g.t} done. It was okay. +${gbp(g.pay)}.`}}));
}

/* ---------- business simulation ---------- */
const BIZNAME={chops:"Small Chops",aso:"Aso Ebi Hub",barber:"Cuts & Braids",suya:"Suya Spot",lounge:"Lounge"};
function bizCan(type){const B=BIZ[type];if(S.workBan)return 'You can\'t run a business while your asylum claim is being decided';if(S.biz)return 'You already run a business';if(S.money<B.cost)return `You need ${gbp(B.cost)} to start`;return false}
function startBiz(type){
  const why=bizCan(type);if(why){toast(why);return}
  const B=BIZ[type];spend(B.cost,`Started ${B.n}`);
  const home=CITIES[S.city].homes.find(h=>h.id===S.home);
  const off=[[.004,.006],[-.005,.004],[.003,-.006]][Math.floor(hash(S.pid)*3)];
  S.biz={type,name:`${S.name}'s ${BIZNAME[type]}`,day0:S.day,price:1,stock:Math.round(B.cap*.8),staff:0,rep:45,mkt:0,lvl:1,hist:[],workedDay:-1,ll:[home.ll[0]+off[0],home.ll[1]+off[1]],total:0};
  CM=null;log(`You opened ${S.biz.name}! ${B.where==='premises'?'Find it on the map next to your home.':'Run it from home.'}`,'good');
  msg('mummy',`My child is now a business owner!! ${B.icon} I have told the whole church.`);
}
const bizUnitPrice=()=>BIZ[S.biz.type].price[S.biz.price];
const bizCap=()=>Math.round(BIZ[S.biz.type].cap*(1+(S.biz.lvl-1)*.5));
function bizValue(){if(!S.biz)return 0;return Math.round(BIZ[S.biz.type].cost*.6*(1+(S.biz.lvl-1)*.4)*(.6+S.biz.rep/125))}
function bizDay(){
  const Z=S.biz;if(!Z)return;const B=BIZ[Z.type],d=(S.day-2+7)%7; // yesterday's weekday
  let f=1;
  if(Z.type==='lounge')f=d===4||d===5?3:d===6?1.4:.5;
  else if(Z.type==='suya')f=(d>=4?1.6:1)*({Drizzle:.7,'Cold snap':.6,'Sunny spell':1.4}[S.weather]||1);
  else if(Z.type==='barber')f=d===5?1.6:d===6?.3:1;
  else if(Z.type==='aso')f=d===3||d===4?2:d===6?.3:.8;
  else if(Z.type==='chops')f=d>=4&&d<=5?1.8:.8;
  const worked=Z.workedDay===S.day-1;
  const priceF=[1.3,1,.68][Z.price],repF=.45+Z.rep/90,mkt=Z.mkt>0?1.35:1;
  const demand=Math.round(B.base*f*priceF*repF*mkt*(worked?1.2:1)*(S.biz.lvl>1?1.15:1)*rnd(.8,1.2));
  const capacity=Math.round(bizCap()*(Z.staff?Math.min(1,.45+Z.staff*.35):worked?.7:.3));
  const sold=Math.max(0,Math.min(demand,capacity,Z.stock));
  const rev=r2(sold*bizUnitPrice()),wages=Z.staff*B.staff,rent=r2(B.rent/7);
  Z.stock-=sold;
  let dr=0;if(demand>capacity||demand>sold)dr-=3;if(Z.price===2)dr-=1;if(Z.price===0)dr+=1;if(worked)dr+=2;if(sold>0&&sold===demand)dr+=1;dr+=Math.round(rnd(-1,1));
  Z.rep=clamp(Z.rep+dr,5,100);if(Z.mkt>0)Z.mkt--;
  const cogs=r2(sold*B.stock);const profit=r2(rev-wages-rent-cogs);
  if(rev)earn(rev,`${Z.name} takings`);if(wages)spend(wages,`${Z.name} staff wages`);if(rent)spend(rent,`${Z.name} rent`);
  Z.total=r2(Z.total+profit);
  Z.hist.push({d:S.day-1,rev,cost:r2(wages+rent+cogs),sold,demand,profit});Z.hist=Z.hist.slice(-14);
  if(Z.stock<bizCap()*.25&&Math.random()<.6)msg('biz',`Stock is running low: ${Z.stock} ${B.unit}s left. Restock in the Business app.`);
  if(demand>sold&&Z.stock>0&&!Z.staff&&Math.random()<.5)msg('biz',`${demand-sold} customers walked away yesterday. You need staff, or work there yourself.`);
}

/* cars & walkers */
const isRoad=(i,j)=>i>=0&&j>=0&&i<CY.N&&j<CY.N&&(CM.tile[i][j]==='road'||CM.tile[i][j]==='bridge');
function newCar(){let i,j;do{i=Math.floor(Math.random()*CY.N);j=Math.floor(Math.random()*CY.N)}while(!isRoad(i,j));const dirs=[[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b])=>isRoad(i+a,j+b));const [di,dj]=pick(dirs.length?dirs:[[1,0]]);
  return {i,j,di,dj,t:Math.random(),sp:.6+Math.random()*.7,col:pick(['#C24E36','#2B5BA8','#F2F2F2','#1B1F1D','#C9921B','#08774C','#B3261E']),bus:Math.random()<.15}}
function stepCar(c,dt){c.t+=dt*c.sp*1.6;while(c.t>=1){c.t-=1;c.i+=c.di;c.j+=c.dj;
  const opts=[[c.di,c.dj],[c.dj,c.di],[-c.dj,-c.di]].filter(([a,b])=>isRoad(c.i+a,c.j+b));
  if(!opts.length){c.di=-c.di;c.dj=-c.dj}else{const atX=c.i%5===0&&c.j%5===0;const o=atX?pick(opts):(opts.find(([a,b])=>a===c.di&&b===c.dj)||pick(opts));c.di=o[0];c.dj=o[1]}}}
function newWalker(){const c=newCar();c.sp=.12+Math.random()*.1;c.col=pick(['#C24E36','#2B5BA8','#F2B705','#7A3FA0','#08774C','#ddd']);c.off=Math.random()<.5?.18:.82;return c}

/* camera + frame */
function cyWorld(sx,sy){const {cam}=CMV,cw=CMV.cv.clientWidth,ch=CMV.cv.clientHeight;return [(sx-cw/2)/cam.z+cam.x,(sy-ch/2)/cam.z+cam.y]}
function cyScreen(wx,wy){const {cam}=CMV,cw=CMV.cv.clientWidth,ch=CMV.cv.clientHeight;return [(wx-cam.x)*cam.z+cw/2,(wy-cam.y)*cam.z+ch/2]}
function cyClampCam(){const {cam}=CMV;cam.z=Math.max(cyMinZ(),Math.min(2.6,cam.z));cam.x=Math.max(0,Math.min(CM.W,cam.x));cam.y=Math.max(CY.PADT*.5,Math.min(CM.H,cam.y))}
function cyMinZ(){return CMV.cv?Math.max(.22,CMV.cv.clientWidth/CM.W*.9):.3}
function cyCentreOn(id,z){const v=venue(id);const p=v&&venueCentre(v);if(!p)return;const [x,y]=cyIso(p[0],p[1]);CMV.cam.x=x;CMV.cam.y=y-20;if(z)CMV.cam.z=z;cyClampCam()}
function initCity(){
  const cv=$('citycv');if(!cv)return;
  if(!CM||CM.city!==S.city)buildCity();
  CMV.cv=cv;CMV.ctx=cv.getContext('2d');
  if(!CMV.inited||CMV.inited!==S.city){CMV.inited=S.city;CMV.cam.z=.85}
  cyCentreOn(sheet.sel||S.at);
  bindCityInput(cv);
  cancelAnimationFrame(CMV.raf);CMV.last=performance.now();CMV.raf=requestAnimationFrame(cityFrame);
}
function cityFrame(t){
  const cv=CMV.cv;if(!cv||!cv.isConnected||sheet?.type!=='map'||sheet.real){CMV.raf=0;return}

  const dt=Math.min(.05,(t-CMV.last)/1000);CMV.last=t;
  const r=window.devicePixelRatio||1,cw=cv.clientWidth,ch=cv.clientHeight;

    if(m==='walk')drawPerson(c,x,y,S.look,.32,{walk:true,t});
    else{const col=m==='bus'?(CITIES[S.city].london?'#C8102E':'#E8B10E'):'#111';c.fillStyle=col;c.beginPath();c.roundRect?c.roundRect(x-9,y-12,18,10,3):c.rect(x-9,y-12,18,10);c.fill();c.fillStyle='#BFD8E8';c.fillRect(x-7,y-10,14,3);drawPerson(c,x,y-12,S.look,.18,{t})}}

  if(cam.z<1.5){c.font='800 12px Figtree,system-ui,sans-serif';c.textAlign='center';const placed=[];CM.districts.forEach(d=>{const [wx,wy]=cyIso(d.i,d.j+1.6);const [x,y]=cyScreen(wx,wy);if(x<-50||x>cw+50||y<-20||y>ch+20)return;if(placed.some(([a,b2])=>Math.abs(a-x)<90&&Math.abs(b2-y)<18))return;placed.push([x,y]);c.fillStyle='rgba(255,255,255,.55)';const w=c.measureText(d.n.toUpperCase()).width+12;c.fillRect(x-w/2,y-10,w,15);c.fillStyle='#18221E';c.fillText(d.n.toUpperCase(),x,y+1)})}
  // pins
  const vs=venues().filter(v=>!v.trip&&CM.bbox[v.id]);
  const showLbl=cam.z>=.75;

    const bb=CM.bbox[v.id],[x,y]=cyScreen(...bb.top);if(x<-30||x>cw+30||y<-30||y>ch+30)return;
    const sel=sheet.sel===v.id,open=isOpen(v.type),cat=VT[v.type].cat,rad=sel?15:v.type==='home'?13:11;

    c.globalAlpha=1;c.textBaseline='alphabetic';
    if(S.at===v.id&&!CMV.trip){const [ax,ay]=cyScreen(...cyIso(...venueCentre(v)));drawPerson(c,ax+18,ay+8,S.look,.42,{t});c.font='800 10px Figtree,sans-serif';c.fillStyle='#08774C';const w=30;c.fillRect(ax+18-w/2,ay-26,w,13);c.fillStyle='#fff';c.textAlign='center';c.fillText('YOU',ax+18,ay-16)}

}

/* input */
function bindCityInput(cv){
  if(cv._bound)return;cv._bound=true;
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);CMV.ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);CMV.drag={x:e.offsetX,y:e.offsetY,cx:CMV.cam.x,cy:CMV.cam.y,moved:0,z:CMV.cam.z,d0:null}});
  cv.addEventListener('pointermove',e=>{if(!CMV.ptrs.has(e.pointerId))return;CMV.ptrs.set(e.pointerId,[e.offsetX,e.offsetY]);const D=CMV.drag;if(!D)return;
    if(CMV.ptrs.size===2){const [a,b]=[...CMV.ptrs.values()];const d=Math.hypot(a[0]-b[0],a[1]-b[1]);if(!D.d0){D.d0=d;D.z=CMV.cam.z}CMV.cam.z=D.z*d/D.d0;D.moved=99;cyClampCam();return}
    const dx=e.offsetX-D.x,dy=e.offsetY-D.y;D.moved=Math.max(D.moved,Math.hypot(dx,dy));CMV.cam.x=D.cx-dx/CMV.cam.z;CMV.cam.y=D.cy-dy/CMV.cam.z;cyClampCam()});
  const up=e=>{const D=CMV.drag;CMV.ptrs.delete(e.pointerId);if(D&&D.moved<6&&e.type==='pointerup'&&!CMV.trip)cityTap(e.offsetX,e.offsetY);if(!CMV.ptrs.size)CMV.drag=null};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{e.preventDefault();CMV.cam.z*=e.deltaY<0?1.12:.89;cyClampCam()},{passive:false});
}
function cityTap(sx,sy){
  const vs=venues().filter(v=>!v.trip&&CM.bbox[v.id]);
  let hit=null,bd=1e9;
  vs.forEach(v=>{const [x,y]=cyScreen(...CM.bbox[v.id].top);const d=Math.hypot(x-sx,y-sy);if(d<20&&d<bd){bd=d;hit=v.id}});
  if(!hit){const [wx,wy]=cyWorld(sx,sy);let dep=-1;vs.forEach(v=>{const b=CM.bbox[v.id];if(wx>=b.x0&&wx<=b.x1&&wy>=b.y0&&wy<=b.y1&&b.depth>dep){dep=b.depth;hit=v.id}})}
  if(hit)selectPin(hit);
}

/* travel animation along roads */
function doorTile(v){
  const p=CM.venueLot[v.id];if(!p)return null;const [i0,j0,w]=p.lot?[p.lot.i0,p.lot.j0,2]:[p.block[0]*5+1,p.block[1]*5+1,4];
  const cand=[];for(let k=-1;k<=w;k++){cand.push([i0+k,j0+w],[i0+w,j0+k],[i0+k,j0-1],[i0-1,j0+k])}
  return cand.filter(([i,j])=>isRoad(i,j)).sort((a,b)=>(b[0]+b[1])-(a[0]+a[1]))[0]||null;
}
function roadPath(a,b){
  if(!a||!b)return null;const key=(i,j)=>i*100+j,prev=new Map([[key(...a),null]]),q=[a];
  while(q.length){const [i,j]=q.shift();if(i===b[0]&&j===b[1])break;for(const [di,dj] of [[1,0],[-1,0],[0,1],[0,-1]]){const n=[i+di,j+dj];const k=key(...n);if(!prev.has(k)&&isRoad(...n)){prev.set(k,[i,j]);q.push(n)}}}
  if(!prev.has(key(...b)))return null;const out=[];let cur=b;while(cur){out.unshift(cur);cur=prev.get(key(...cur))}return out;
}
function animateTravel(to,mode,done){
  const a=here(),b=venue(to);
  if(!CMV.cv||!CMV.cv.isConnected||reduceMotion||a.trip||b.trip||mode==='train'){done();return}
  const path=roadPath(doorTile(a),doorTile(b));if(!path||path.length<2){done();return}
  const pts=path.map(([i,j])=>cyIso(i+.5,j+.5));
  const dur=Math.max(1100,Math.min(3200,path.length*(mode==='walk'?95:55)));
  CMV.trip={pts,mode,start:performance.now(),dur,done,pos:pts[0]};
  CMV.cam.z=Math.max(CMV.cam.z,.95);
  const vi=$('vinfo');if(vi)vi.innerHTML=`<div class="vinfo"><div class="nm">On the way to ${esc(b.name)}…</div><div class="meta">${mode==='walk'?'Walking':mode==='bus'?(CITIES[S.city].london?'On the bus':'On the bus'):'In an Uber'}</div></div>`;
}
function tripStep(t){
  const T=CMV.trip,u=Math.min(1,(t-T.start)/T.dur),e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  const f=e*(T.pts.length-1),k=Math.min(T.pts.length-2,Math.floor(f)),r=f-k;
  const [x0,y0]=T.pts[k],[x1,y1]=T.pts[k+1];T.pos=[x0+(x1-x0)*r,y0+(y1-y0)*r];
  CMV.cam.x+=(T.pos[0]-CMV.cam.x)*.12;CMV.cam.y+=(T.pos[1]-CMV.cam.y)*.12;
  if(u>=1){const d=T.done;CMV.trip=null;setTimeout(d,250)}
}

const LAYOUTS={

function homeDef(){return CITIES[S.city].homes.find(h=>h.id===S.home)}
function layoutKey(){const h=homeDef();return h.layout||(h.hotel?'hotel':h.shared?'room':'studio')}
const LAY=()=>LAYOUTS[layoutKey()];
function ensureItems(){
  if(S.items)return;
  S.items=[];S.store=[];S.acc=[];S.uid=1;
  const map={mattress:'mattress',bed:'double',chair:'chair',sofa:'sofa2',tv:'tv43',desk:'desk',photos:'photos',plants:'plant',speaker:'speaker',ringlight:'ringlight',blanket:'blanket',freezer:'freezer',rug:'ankara'};
  (S.furn||['mattress','chair']).forEach(k=>{const m=map[k];if(!m)return;if(m==='mattress'&&(S.furn||[]).includes('bed'))return;giveItem(m,true)});
  if(!S.items.length&&!S.store.length){giveItem('mattress',true);giveItem('chair',true)}
}
function giveItem(k,silent){
  const I=ITEMS[k];
  if(I.acc){S.acc.push(k);return 'acc'}
  const it={u:S.uid++,k,rot:0};
  if(LAY().hotel){S.store.push(it);return 'store'}
  const pos=autoPlace(it);

  S.store.push(it);return 'store';
}

  f.comfort=Math.min(1.3,f.comfort);

function wallSegs(L){const out=[];L.walls.forEach(W=>{const hor=W.y1===W.y2;const a=hor?W.x1:W.y1,b=hor?W.x2:W.y2;
  const parts=W.gap?[[a,W.gap[0]],[W.gap[1],b]]:[[a,b]];parts.forEach(([p,q])=>{if(q-p>.01)out.push(hor?{x1:p,y1:W.y1,x2:q,y2:W.y1}:{x1:W.x1,y1:p,x2:W.x1,y2:q})})});return out}

function drawHome2(t){
  ensureItems();const L=LAY();fitView(L);readColors();
  const c=ctx;c.fillStyle=colors['--surface']||'#fff';c.fillRect(0,0,360,230);

  drawWallsAndWindows(c,L,t);
  S.items.filter(it=>ITEMS[it.k].wallItem).forEach(it=>drawWallItem(c,it));
  drawFairy(c,L,t);
  // depth-sorted drawables
  const dr=[];
  L.fix.forEach(f=>{const r=fixRect(f);if(r)dr.push({d:r.x+r.w+r.y+r.d,f:()=>drawFixture(c,f,t)})});

    const R=roomAt(x+w/2+.06,y+d/2+.06)||L.rooms[0];dr.push({d:x+w+y+d-.2,f:()=>hBox(c,x,y,w,d,.7,R.wall?shade(R.wall,.95):'#ccc','#F7F5F0')})});
  S.items.filter(it=>!ITEMS[it.k].floor&&!ITEMS[it.k].wallItem).forEach(it=>{const [w,d]=itemSize(it);dr.push({d:it.x+w+it.y+d-.3,f:()=>{drawItem(c,it,t);if(DEC.sel===it.u)selBox(c,it)}})});
  dr.push({d:anim.x+anim.y,f:()=>{const [x,y]=hIso(anim.x,anim.y);drawPerson(c,x,y,S.look,.6*HV.tw/48,{walk:anim.walking,t,mood:mood()});if(anim.emote&&t<anim.emoteUntil)bubble(x,y-HV.tw*.95,anim.emote)}});
  if(married())dr.push({d:6,f:()=>{const p=idleSpot();const [x,y]=hIso(p[0]+.5,p[1]+.3);drawPerson(c,x,y,lookOf(S.partner),.6*HV.tw/48,{t})}});
  dr.sort((a,b)=>a.d-b.d).forEach(o=>o.f());

const DEC={on:false,sel:null};

  const grid=blockGrid(it.u);const nx=it.x+dx*CELL,ny=it.y+dy*CELL;if(fits(it,nx,ny,it.rot,grid)){it.x=nx;it.y=ny}else toast("It won't fit there.")}

function decStore(){const k=S.items.findIndex(i=>i.u===DEC.sel);if(k<0)return;const it=S.items.splice(k,1)[0];delete it.x;delete it.y;S.store.push(it)}
function decPlace(u){const k=S.store.findIndex(i=>i.u===u);if(k<0)return;if(LAY().hotel){toast("You can't furnish a hotel room.");return}const it=S.store[k];const pos=autoPlace(it);if(!pos){toast('No space. Store or sell something first, or move to a bigger home.');return}Object.assign(it,pos);S.store.splice(k,1);S.items.push(it);DEC.sel=it.u}
function decSell(){let it=S.items.find(i=>i.u===DEC.sel),from=S.items;if(!it){it=S.store.find(i=>i.u===DEC.sel);from=S.store}if(!it)return;if(ITEMS[it.k].sell===false){toast('Nobody wants this one. Store it instead.');return}const v=Math.round(ITEMS[it.k].p*.5);from.splice(from.indexOf(it),1);earn(v,`Sold ${ITEMS[it.k].n}`);DEC.sel=null;toast(`Sold for ${gbp(v)}.`)}
function decTap(px,py){ // canvas logical coords
  if(!DEC.on)return;let best=null,bd=1e9;
  S.items.forEach(it=>{if(ITEMS[it.k].wallItem){const p=wallPt(it.wall,it.at+.3,1.5);const dd=Math.hypot(p[0]-px,p[1]-py);if(dd<14&&dd<bd){bd=dd;best=it}return}const [w,d,h]=itemSize(it);const p=hIso(it.x+w/2,it.y+d/2,h/2);const dd=Math.hypot(p[0]-px,p[1]-py);if(dd<HV.tw*.9&&dd<bd){bd=dd;best=it}});
  if(best){DEC.sel=best.u;render();return}
  const it=S.items.find(i=>i.u===DEC.sel);if(!it||ITEMS[it.k].wallItem)return;
  // inverse iso at floor level
  const u=(px-HV.ox)/(HV.tw/2),v=(py-HV.oy)/(HV.th/2);const gx=Math.round((u+v)/2/CELL)*CELL,gy=Math.round((v-u)/2/CELL)*CELL;const [w,d]=itemSize(it);
  const nx=Math.round((gx-w/2)/CELL)*CELL,ny=Math.round((gy-d/2)/CELL)*CELL;if(fits(it,nx,ny,it.rot,blockGrid(it.u))){it.x=nx;it.y=ny;render()}else toast("It won't fit there.");
}

/* ---------- moving home ---------- */
function moveHome(id){
  const h=CITIES[S.city].homes.find(x=>x.id===id),old=homeDef();if(!h||h.id===S.home)return;
  const dep=(h.rent||0)*5,refund=(old.rent||0)*5,cost=dep+(h.rent||0)+80-refund;
  if(S.workBan){toast('You can\'t move out of the hotel while your claim is pending.');return}
  if(S.money<cost){toast(`You need ${gbp(cost)} for the deposit, first week and van.`);return}
  if(refund)earn(refund,'Deposit returned (DPS)');spend(dep,'New deposit (5 weeks)');if(h.rent)spend(h.rent,'First week rent');spend(80,'Man with a van');
  const all=[...S.items,...S.store];S.items=[];S.store=[];S.home=id;S.at='home';CM=null;anim.reset=true;
  all.sort((a,b)=>(ITEMS[b.k].sz?ITEMS[b.k].sz[0]*ITEMS[b.k].sz[1]:0)-(ITEMS[a.k].sz?ITEMS[a.k].sz[0]*ITEMS[a.k].sz[1]:0)).forEach(it=>{delete it.x;delete it.y;delete it.wall;const pos=LAY().hotel?null:autoPlace(it);if(pos){Object.assign(it,pos);S.items.push(it)}else S.store.push(it)});
  log(`Moved into a ${h.name}. ${S.store.length?`${S.store.length} items went into storage.`:'Everything fits.'}`,'good');
  msg('mummy',`New house!! Send me pictures. Is there space for me when I visit? 😄`);
}
function homeBills(h){h=h||homeDef();return {room:0,hotel:0,studio:28,flat:34,house:45}[h.layout||(h.hotel?'hotel':h.shared?'room':'studio')]}

function relayout(){S.store.slice().forEach(it=>{const pos=LAY().hotel?null:autoPlace(it);if(pos){Object.assign(it,pos);S.store.splice(S.store.indexOf(it),1);S.items.push(it)}})}

/* player */
let storyRaf=0;
function storyNode(){return STORY[C.node]}
function showStory(){
  const ov=$('overlay');ov.dataset.mode='creator';const n=storyNode();
  const people=typeof n.people==='function'?n.people():n.people;
  if(n.ch)C.chapter=n.ch;
  const choices=n.choices?n.choices.map((ch,i)=>`<button class="choice" data-sc="${i}">${esc(ch.l)}${ch.s?`<small>${esc(ch.s)}</small>`:''}</button>`).join(''):`<button class="go" data-snext>Continue</button>`;
  ov.innerHTML=`<div class="overlay solid story"><div class="modal"><div class="skick"><span>${esc(C.chapter||'')}</span><button class="ghost" data-sskip>Skip story</button></div>
    <div class="scv"><canvas id="storycv"></canvas></div>
    ${n.who?`<div class="swho">${esc(n.who)}</div>`:''}<p class="stext">${esc(n.text())}</p><div style="display:grid;gap:8px">${choices}</div></div></div>`;
  const cv=$('storycv');cancelAnimationFrame(storyRaf);
  const loop=t=>{if(!cv.isConnected)return;const r=window.devicePixelRatio||1,w=cv.clientWidth;if(cv.width!==Math.round(w*r)){cv.width=Math.round(w*r);cv.height=Math.round(w*r*230/360)}const c=cv.getContext('2d');c.setTransform(cv.width/360,0,0,cv.height/230,0,0);sceneDraw(c,n.scene,reduceMotion?0:t,people);if(!reduceMotion)storyRaf=requestAnimationFrame(loop)};
  storyRaf=requestAnimationFrame(loop);
}
function storyGo(next){
  const go=typeof next==='function'?next():next;
  if(go==='@play'){finishStory();return}
  C.node=go;showStory();window.scrollTo({top:0});
}
function storyClick(t){
  const d=t.dataset,n=storyNode();
  if(d.sc!==undefined){const ch=n.choices[+d.sc];if(ch.fx)ch.fx();storyGo(ch.go);return true}
  if(t.hasAttribute('data-snext')){storyGo(n.go);return true}
  if(t.hasAttribute('data-sskip')){Object.assign(C.sv,{route:C.sv.route||'cos',track:C.sv.track||'care',city:C.sv.city||'london',direct:C.sv.direct!==false,dream:C.sv.dream||'top'});if(C.sv.route==='cos'&&C.sv.direct===undefined)C.sv.direct=true;finishStory();return true}
  return false;
}
function startStory(){C.sv={route:null,track:null,city:null,money:300,debt:0,pressure:20,hope:50,stress:20,homesick:40,direct:true,kind:false,truth:false,dream:null};C.node='start';C.chapter='';showStory()}
function finishStory(){
  cancelAnimationFrame(storyRaf);
  const v=C.sv,route=v.route||'cos',city=v.city||(route==='boat'?pick(['london','manchester','leeds']):'london');
  const homes=CITIES[city].homes;
  const home=route==='boat'?homes.find(h=>h.hotel).id:homes.find(h=>!h.hotel&&h.shared).id;
  S=newGame({name:C.name,skin:C.skin,hair:C.hair,fabric:C.fabric,traits:C.traits,dream:v.dream||'top',lottery:'steady',track:route==='boat'?null:route==='student'?'food':(v.track||'care'),city,home});
  S.route=route;S.money=route==='boat'?20:route==='student'?v.money:v.money+(v.direct?300:0);S.debt=v.debt;
  S.pressure=clamp(v.pressure);S.homesick=clamp(v.homesick+(route==='boat'?20:0));S.needs.fun=clamp(v.hope);
  S.storyQ=[];S.flags.kind=v.kind;
  if(route==='cos'){S.visaLabel=v.track==='care'?'Health and Care Worker visa':'Skilled Worker visa';if(!v.direct){S.track=null;S.storyQ.push({day:2,id:'cos_nojob'})}else S.storyQ.push({day:2,id:'cos_first'})}
  if(route==='student'){S.visaLabel='Student visa';S.hoursCap=20;S.npcs.amara.met=true;S.npcs.amara.rel=20;S.storyQ.push({day:3,id:'stu_lecture'},{day:28,id:'stu_grad'})}
  if(route==='boat'){S.visaLabel='Asylum seeker';S.workBan=true;S.support=9;S.npcs.chioma.met=true;S.npcs.chioma.rel=18;S.storyQ.push({day:6,id:'asy_interview'})}
  C=null;const ov=$('overlay');ov.dataset.mode='';ov.innerHTML='';
  log(`Day 1 in ${CITIES[city].name}.`,'good');
  msg('mummy',route==='boat'?'My child!!! You are alive. God is faithful. Call me, I want to hear your voice 🙏🏾😭':'Have you landed?? Call me as soon as you can. God be with you 🙏🏾');
  if(S.debt&&route!=='student')msg('uncle','Welcome. Remember our arrangement: £100 every Monday. God bless.');
  anim.reset=true;save();render();
}

const $=id=>document.getElementById(id);
let sheet=null,toastT=null,busy=false,faceCache={};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function face(id){const look=lookOf(id);const k=id+JSON.stringify(look);if(!faceCache[k])faceCache[k]=faceURL(look);return faceCache[k]}
function meter(label,v,inv){const good=inv?100-v:v,col=good>50?'var(--green)':good>25?'var(--danfo)':'var(--clay)';
  return `<div class="need ${good<=25?'bad':''}"><div class="row"><span>${label}</span><span>${Math.round(v)}</span></div><div class="bar"><i style="width:${clamp(v)}%;background:${col}"></i></div></div>`}
function moodLine(){
  const n=S.needs;
  if(S.sponsorless)return "I have days to find a sponsor. I can't sleep.";
  if(n.bladder<15)return 'Where is the toilet? Quick!';
  if(n.energy<20)return 'My body no be firewood.';
  if(n.hunger<20)return 'Belle dey make noise.';
  if(S.homesick>75)return 'I miss home. I even miss the generator noise.';
  if(S.pressure>75)return 'Mummy has called six times today.';
  if(n.hygiene<20)return 'I need to baff, seriously.';
  if(n.social<20)return 'Nobody has checked on me in days.';
  if(n.fun<20)return 'This UK life is too quiet, abeg.';
  if(S.money<60)return 'Sapa is close. I can feel it.';
  return ['We dey kampe.','Steady, steady.','God is good, the bills are paid.','No shaking.'][S.day%4];
}

function render(){
  if(!S){$('app').hidden=true;$('nav').hidden=true;showCreator();return}
  $('app').hidden=false;$('nav').hidden=false;readColors();
  const v=here();
  $('top').innerHTML=`<div class="brand">Japa <span>Life</span></div><div class="chips"><span class="chip">${DAYS[dow()]} · Day ${S.day}</span><span class="chip">${hhmm(S.hour)}</span><span class="chip">${S.weather}</span><span class="chip money ${S.money<0?'neg':''}">${gbp(S.money)}</span></div>`;
  const cr=crowd(v);$('loc').innerHTML=`<span>${esc(v.name)}</span>${cr?`<span>${cr}</span>`:''}${v.type!=='home'&&!isOpen(v.type)?'<span class="closed">Closed</span>':''}${v.type==='home'&&S.meterOff?'<span class="closed">Meter empty</span>':''}`;
  $('say').innerHTML=`<div style="min-width:0"><div class="who">${esc(S.name)} · ${esc(jobTitle())}</div><b>"${moodLine()}"</b></div>`;
  const n=S.needs;
  $('needs').innerHTML=meter('Belle',n.hunger)+meter('Energy',n.energy)+meter('Freshness',n.hygiene)+meter('Bladder',n.bladder)+meter('Enjoyment',n.fun)+meter('Gist',n.social)+meter('Homesick',S.homesick,true)+meter('Home pressure',S.pressure,true);
  // people
  const ppl=peopleAt(v);
  $('peoplewrap').innerHTML=ppl.length?`<div class="sect" style="margin-bottom:6px">People here</div><div class="people">${ppl.map(id=>`<button class="person" data-npc="${id}"><img class="face" src="${face(id)}" alt=""><span>${NPCS[id].name}<small>${relLabel(id)}</small></span></button>`).join('')}</div>`:'';
  // actions
  const acts=ACTS.filter(a=>{const at=Array.isArray(a.at)?a.at:[a.at];return at.includes(v.type)}).concat(gigActs());
  const rows=acts.filter(a=>v.type==='home'||isOpen(v.type)||a.id==='vloo'&&false).map(actRow);
  let html='';

  else html+=`<button class="act" data-gohome><span class="main"><span class="lbl">Go home</span><span class="sub">${travelOptions('home').map(o=>`${o.label} ${o.cost?gbp2(o.cost):'free'}`).join(' · ')}</span></span><span class="meta"><b>Home</b></span></button>`;
  if(v.type!=='home'&&!isOpen(v.type))html+=`<div class="card" style="padding:12px 14px;font-size:13.5px"><b>Closed right now.</b> ${hoursText(v.type)}</div>`;
  const gigRows=rows.filter(r=>r.includes('data-act="gig-'));html+=gigRows.join('')+rows.filter(r=>!r.includes('data-act="gig-')).join('');
  if(v.type!=='home')html+=`<button class="act" data-map><span class="main"><span class="lbl">Go somewhere else</span><span class="sub">Open the map</span></span><span class="meta"><b>Map</b></span></button>`;
  $('acts').innerHTML=html;
  const lw=$('livewrap');if(lw){lw.hidden=v.type==='home';if(v.type!=='home')lw.innerHTML=liveBox()}
  liveSync();
  $('feed').innerHTML=S.log.map(l=>`<li><time>${l.t}</time><span class="${l.tone}">${esc(l.msg)}</span></li>`).join('')||'<li>Your story starts now.</li>';
  const u=unread();$('pbadge').hidden=!u;$('pbadge').textContent=u;
  document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('on',(b.dataset.nav==='home'&&!sheet)||b.dataset.nav===sheet?.type));
  $('app').classList.toggle('busy',busy);

function actRow(a){
  const why=a.cond&&a.cond();const cost=val(a.cost)||0;const poor=cost&&S.money<cost;const off=why||poor;
  const h=val(a.h);const dur=h>=24?`${Math.round(h/24)}d`:h>=1?`${+h.toFixed(1)}h`:`${Math.round(h*60)}m`;
  const right=a.menu?'<b>Menu</b>':a.invite?'<b>Invite</b>':a.earn?`<b class="plus">+${gbp(a.earn())}</b>`:cost?`<b>${gbp2(cost)}</b>`:'<b>Free</b>';
  return `<button class="act ${off?'off':''} ${a.menu?'go':''}" data-act="${a.id}"><span class="main"><span class="lbl">${esc(val(a.label))}</span><span class="sub">${esc(why||(poor?'Not enough money':val(a.sub)||''))}</span></span><span class="meta">${right}${a.menu||a.invite?'':dur}</span></button>`;
}
function doAct(id){
  if(busy||S.over||S.queue.length)return;if(DEC.on){DEC.on=false;DEC.sel=null}
  const a=ACTS.concat(gigActs()).find(x=>x.id===id);if(!a)return;if(a.books){openSheet({type:'phone',app:'biz'});return}const why=a.cond&&a.cond();if(why){toast(why);return}
  if(a.menu){openSheet({type:'menu'});return}
  if(a.invite){openSheet({type:'invite',pick:[]});return}
  const cost=val(a.cost)||0;if(cost&&S.money<cost){toast(`You need ${gbp2(cost)}. Sapa is real.`);return}
  const go=()=>{
    if(cost)spend(cost,val(a.label));
    advance(val(a.h),{sleep:a.sleep,away:a.away});
    if(!S.over){log(a.run(),a.earn?'good':'');
      if(S.needs.energy<=0){log('You passed out from tiredness and slept for 6 hours.','bad');advance(6,{sleep:true})}}
    anim.tvOn=false;anim.bbq=false;checkGoals();save();busy=false;render();
  };
  busy=true;anim.emote=a.emote||'✨';anim.emoteUntil=performance.now()+(reduceMotion?400:900);
  if(here().type==='home'){
    const item=val(a.item);const sp=a.spot;
    const spot=item?spotForTag(item):sp==='loo'?spotForTag('toilet'):sp==='shower'?spotForTag('bath'):sp==='washer'?spotForTag('washer'):sp==='door'?doorPos():idleSpot();
    anim.path=cellPath([anim.x,anim.y],spot);anim.tx=spot[0];anim.ty=spot[1];if(a.tv)anim.tvOn=true;if(a.id==='bbqparty')anim.bbq=true;
    anim.onArrive=()=>{anim.emoteUntil=performance.now()+700;setTimeout(go,reduceMotion?50:650)};
  }else setTimeout(go,reduceMotion?50:650);
  $('app').classList.add('busy');
}

function renderSheet(){
  const el=$('sheet');
  if(lmap&&(!sheet||sheet.type!=='map'||!sheet.real)){lmap.remove();lmap=null}

  if(sheet.type==='map'&&((sheet.real&&lmap&&$('lmap'))||(!sheet.real&&$('citycv')&&CM&&CM.city===S.city))){const vi=$('vinfo');if(vi&&!CMV.trip)vi.innerHTML=mapInfo();return}
  let body='',cls='panel';
  if(['restart','liveok','liveperson','bizsell','movehome'].includes(sheet.type)){el.innerHTML='';return}
  if(sheet.type==='map')body=mapSheet();
  if(sheet.type==='phone'){cls='panel phone';body=phoneSheet()}
  if(sheet.type==='me')body=meSheet();
  if(sheet.type==='buy')body=buySheet();
  if(sheet.type==='npc')body=npcSheet();
  if(sheet.type==='menu')body=menuSheet();
  if(sheet.type==='invite')body=inviteSheet();

  el.innerHTML=`<div class="scrim" data-close-sheet><div class="${cls}" role="dialog" aria-modal="true">${body}</div></div>`;
  if(sheet.type==='map'&&sheet.real&&useLeaflet())initLeaflet();

  if(sheet.type==='npc'){const c=el.querySelector('#npcav');if(c)drawAvatar(c,lookOf(sheet.id),1.5)}

function initLeaflet(){
  const el=$('lmap');if(!el)return;
  if(lmap){lmap.remove();lmap=null}
  lmarks={};
  const dark=matchMedia('(prefers-color-scheme: dark)').matches&&document.documentElement.dataset.theme!=='light'||document.documentElement.dataset.theme==='dark';
  lmap=L.map(el,{zoomControl:true,attributionControl:true,tap:true});
  lTiles=L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/${dark?'dark_all':'voyager'}/{z}/{x}/{y}{r}.png`,{maxZoom:18,subdomains:'abcd',attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors © <a href="https://carto.com/attributions">CARTO</a>'}).addTo(lmap);
  let loaded=false,errs=0;lTiles.on('tileload',()=>{loaded=true;lOK=true});lTiles.on('tileerror',()=>{if(++errs>=4&&!loaded&&lmap&&lOK!==true){lOK=false;lmap.remove();lmap=null;renderSheet()}});
  if(lOK!==true)setTimeout(()=>{if(!loaded&&sheet?.type==='map'){lOK=false;lmap.remove();lmap=null;renderSheet()}},4000);
  const vs=venues().filter(v=>!v.trip);
  vs.forEach(v=>{const cat=VT[v.type].cat;
    const m=L.circleMarker(v.ll,{radius:v.type==='home'?11:8,color:'#fff',weight:2.5,fillColor:CATCOL[cat],fillOpacity:isOpen(v.type)?1:.45}).addTo(lmap);
    m.bindTooltip(esc(shortName(v)),{direction:'top',offset:[0,-8],permanent:v.type==='home'||v.id===sheet.sel,className:'jl-tip'});
    m.on('click',()=>selectPin(v.id));lmarks[v.id]=m});
  const cur=here();if(!cur.trip)lHere=L.circleMarker(cur.ll,{radius:17,color:'#18221E',weight:2,dashArray:'4 4',fill:false,interactive:false}).addTo(lmap);
  const b=L.latLngBounds(vs.filter(v=>v.type!=='airport'&&v.type!=='test').map(v=>v.ll));
  lmap.fitBounds(b,{padding:[18,18]});
  if(sheet.sel&&lmarks[sheet.sel])lmap.panTo(lmarks[sheet.sel].getLatLng());
  setTimeout(()=>lmap&&lmap.invalidateSize(),60);
}
function selectPin(id){
  const prev=sheet.sel;sheet.sel=id;
  if(lmap){[prev,id].forEach(k=>{const m=lmarks[k];if(!m)return;const v=venue(k);m.unbindTooltip();m.bindTooltip(esc(shortName(v)),{direction:'top',offset:[0,-8],permanent:v.type==='home'||k===id,className:'jl-tip'});m.setStyle({color:k===id?'#18221E':'#fff',weight:k===id?3.5:2.5})});
    if(lmarks[id])lmap.panTo(lmarks[id].getLatLng());const vi=$('vinfo');if(vi)vi.innerHTML=mapInfo();}
  else if(sheet.type==='map'&&!sheet.real&&CMV.cv){const vi=$('vinfo');if(vi)vi.innerHTML=mapInfo();if(id)cyCentreOn(id)}
  else render();
}

function creatorClick(t){
  if(C&&C.node){storyClick(t);return}
  const d=t.dataset;
  if(t.hasAttribute('data-story')){const nm=$('nm');if(nm)C.name=nm.value.trim().slice(0,16)||'Tunde';startStory();return}
  if(t.id==='nm')return;
  const nm=$('nm');if(nm)C.name=nm.value.trim().slice(0,16)||'Tunde';
  if(d.c){C[d.c]=d.c==='skin'?+d.v:d.v}
  else if(d.trait!==undefined){const i=C.traits.indexOf(d.trait);if(i>=0)C.traits.splice(i,1);else if(C.traits.length<2)C.traits.push(d.trait);else{C.traits.shift();C.traits.push(d.trait)}}
  else if(d.dream)C.dream=d.dream;
  else if(d.track)C.track=d.track;
  else if(d.city){C.city=d.city;C.home=null}
  else if(d.home)C.home=d.home;
  else if(t.hasAttribute('data-next'))C.step++;
  else if(t.hasAttribute('data-back'))C.step=Math.max(0,C.step-1);
  else if(t.hasAttribute('data-spin')){spin();return}
  else if(t.hasAttribute('data-start')){
    S=newGame(C);$('overlay').dataset.mode='';$('overlay').innerHTML='';C=null;
    log(`New week, new vibes. ${S.name} has ${gbp(S.money)} and a whole city to explore.`,'good');
    msg('mummy','Good morning my dear. Have you eaten? Call me when you can 🙏🏾');
    msg('gang','Who is free this weekend? Owambe Saturday, suya after 🔥');
    if(S.debt)msg('uncle','Welcome. Remember our arrangement: £100 every Monday. God bless.');
    anim.reset=true;save();render();return}
  showCreator();
}

  if(d.travel){if(CMV.trip)return;const o=travelOptions(d.travel).find(x=>x.id===d.mode);if(!o)return;if(S.money<o.cost){toast(`You need ${gbp2(o.cost)} for that.`);return}
    const go=()=>{if(travel(d.travel,d.mode)){sheet=null;checkGoals();save();render();window.scrollTo({top:0})}};
    if(sheet&&sheet.type==='map'&&!sheet.real)animateTravel(d.travel,d.mode,go);else go();return}
  if(d.mz){CMV.cam.z*=d.mz==='1'?1.3:1/1.3;cyClampCam();return}
  if(t.hasAttribute('data-mme')){cyCentreOn(S.at,Math.max(CMV.cam.z,.9));return}
  if(d.mreal!==undefined){sheet.real=d.mreal==='1';CMV.cv=null;render();return}
  if(d.npc){openSheet({type:'npc',id:d.npc});return}
  if(d.npcact){doNpc(sheet.id,d.npcact);return}
  if(d.furn){const I=ITEMS[d.furn];if(S.money<I.p){toast(`You need ${gbp(I.p)}.`);return}spend(I.p,I.n);const r=giveItem(d.furn);toast(r==='acc'?`${I.n} added.`:r==='placed'?`${I.n} placed in your home.`:`${I.n} went into storage. No space right now.`);log(`Bought: ${I.n}.`,'good');checkGoals();save();render();return}
  if(d.cat){sheet.cat=d.cat;render();return}
  if(t.hasAttribute('data-decorate')){DEC.on=!DEC.on;DEC.sel=null;render();return}
  if(d.dsel){DEC.sel=+d.dsel;render();return}
  if(d.dmove){const [x,y]=d.dmove.split(',').map(Number);decMove(x,y);save();render();return}
  if(t.hasAttribute('data-drot')){decRotate();save();render();return}
  if(t.hasAttribute('data-dstore')){decStore();save();render();return}
  if(t.hasAttribute('data-dsell')){decSell();save();render();return}
  if(d.dplace){decPlace(+d.dplace);save();render();return}
  if(d.movehome){sheet={type:'movehome',id:d.movehome,back:sheet};render();return}
  if(t.hasAttribute('data-move-yes')){moveHome(sheet.id);sheet=null;checkGoals();save();render();window.scrollTo({top:0});return}
  if(d.app!==undefined){sheet.app=d.app||null;sheet.thread=null;render();return}
  if(d.thread!==undefined){sheet.thread=d.thread||null;save();render();return}
  if(d.reply!==undefined){replyWA(sheet.thread,+d.reply);checkGoals();save();render();return}
  if(d.remit){const a=+d.remit;if(S.money<a)return;spend(a,'Sent home');S.sentHome+=a*S.rate;add('pressure',-Math.min(40,a/4));log(`Sent ${ngn(a*S.rate)} home.`,'good');checkGoals();save();render();return}
  if(d.bank==='uncle'){const p=Math.min(500,S.debt);spend(p,'Paid Uncle Femi');S.debt-=p;if(S.debt<=0)log('Uncle Femi is fully paid back!','good');save();render();return}
  if(d.bank==='loan'){spend(S.loan,'Cleared quick loan');S.loan=0;save();render();return}
  if(d.bank==='take'){earn(500,'Quick loan');S.loan=600;log('Took a £500 quick loan. £150 a week for 4 weeks.','bad');save();render();return}
  if(d.apply){const r=applyJob(d.apply);toast(r||`You got the job: ${jobTitle()}!`);checkGoals();save();render();return}
  if(d.ukvi==='renew'){spend(1500,'Visa extension and health surcharge');S.renewDue=false;S.renewed=true;log('Visa extended. Settlement clock running again.','good');save();render();return}
  if(d.ukvi==='ilr'){spend(3000,'ILR application');S.visa='ilr';add('pressure',-40);add('fun',60);log('ILR GRANTED. You are settled. The family WhatsApp is on fire.','good');checkGoals();save();render();return}
  if(d.choice!==undefined){choose(+d.choice);return}
  if(d.gig){acceptGig(+d.gig);save();render();return}
  if(d.gigdrop){const G=S.gigs;G.acc=G.acc.filter(g=>g.gid!==+d.gigdrop);G.rating=Math.max(1,r2(G.rating-.3));toast('Gig cancelled. Rating dropped a little.');save();render();return}
  if(d.bizstart){startBiz(d.bizstart);checkGoals();save();render();return}
  if(d.bizprice){S.biz.price=+d.bizprice;save();render();return}
  if(d.bizstock){bizRestock(+d.bizstock);save();render();return}
  if(d.bizstaff){bizStaff(+d.bizstaff);save();render();return}
  if(t.hasAttribute('data-bizmkt')){if(!S.biz.mkt)bizMarket();save();render();return}
  if(t.hasAttribute('data-bizup')){bizUpgrade();save();render();return}
  if(t.hasAttribute('data-bizsell')){sheet={type:'bizsell',back:sheet};render();return}
  if(t.hasAttribute('data-bizsell-yes')){bizClose();sheet=sheet.back||null;save();render();return}
  if(d.dish){const m=orderDish(d.dish);log(m,'');toast(m);sheet=null;checkGoals();save();render();return}
  if(d.inv){const i=sheet.pick.indexOf(d.inv);if(i>=0)sheet.pick.splice(i,1);else if(sheet.pick.length<3)sheet.pick.push(d.inv);render();return}
  if(t.hasAttribute('data-invite-go')){const m=inviteFriends(sheet.pick);log(m,'');toast(m);sheet=null;save();render();return}
  if(d.topic){talkTopic(d.topic);checkGoals();save();render();return}
  if(d.q!==undefined){answerQ(+d.q);save();render();return}
  if(t.hasAttribute('data-endtalk')){endTalk();render();return}
  if(d.text){const w=canText(sheet.thread);if(w){toast(w);return}textTopic(sheet.thread,d.text);checkGoals();save();render();return}
  if(t.hasAttribute('data-live-consent')){sheet={type:'liveok',back:sheet};render();return}
  if(t.hasAttribute('data-live-yes')){S.flags.liveOK=true;save();sheet=sheet.back||null;render();return}
  if(t.hasAttribute('data-live-no')){sheet=sheet.back||null;render();return}
  if(d.liveperson){const p=LIVE.people[d.liveperson];sheet={type:'liveperson',pid:d.liveperson,name:p?.name||'Player',back:sheet};render();return}
  if(t.hasAttribute('data-mute')){S.muted[sheet.pid]=true;save();toast('Muted. You will not see their messages.');sheet=sheet.back||null;render();return}
  if(t.hasAttribute('data-restart-ask')){sheet={type:'restart'};render();return}
  if(t.hasAttribute('data-cancel')){sheet=null;render();return}
  if(t.hasAttribute('data-restart')){S=null;sheet=null;try{localStorage.removeItem(KEY)}catch(e){};$('overlay').innerHTML='';render();return}
});
document.addEventListener('pointerup',e=>{if(!DEC.on||e.target.id!=='cv'||S.at!=='home')return;const r=e.target.getBoundingClientRect();decTap((e.clientX-r.left)/r.width*360,(e.clientY-r.top)/r.height*230)});
document.addEventListener('submit',e=>{if(e.target.matches('[data-liveform]')){e.preventDefault();const i=$('livein');liveSend(i.value);i.value=''}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-pin]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}if(e.key==='Escape'&&sheet){closeSheet()}});
document.addEventListener('input',e=>{if(e.target.id==='nm'&&C)C.name=e.target.value.slice(0,16)});

/* ---------- boot ---------- */
function start(data){
  cv=$('cv');ctx=cv.getContext('2d');dpr=Math.min(2,window.devicePixelRatio||1);readColors();
  if(data&&data.state)S=data.state;else{try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){S=null}}
  render();requestAnimationFrame(frame);
  setInterval(()=>{if(S&&LIVE.ok)liveRefresh()},30000);
  matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{readColors();patCache={};render()});
}
window.claude?.hot?.snapshot?.(()=>({state:S}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});

</script>

<script>
if('serviceWorker' in navigator && !window.Capacitor && location.protocol!=='file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
